name: Windows RDP Persistent

on:
  workflow_dispatch: 
    inputs:
      hostname:
        description: '1. Tên máy ảo (vd: pc-test)'
        required: true
        default: 'github-win'
      username:
        description: '2. Tên đăng nhập (Bỏ trống để tạo ngẫu nhiên)'
        required: false
      password:
        description: '3. Mật khẩu (Bỏ trống để tạo ngẫu nhiên)'
        required: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360 

    steps:
    - name: 1. Setup RDP & Tạo User
      shell: powershell
      run: |
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        
        powercfg /change standby-timeout-ac 0
        powercfg /change monitor-timeout-ac 0
        powercfg /change hibernate-timeout-ac 0
        Set-MpPreference -DisableRealtimeMonitoring $true
        
        # --- XỬ LÝ TÊN ĐĂNG NHẬP ---
        $inputUser = "${{ github.event.inputs.username }}"
        if ([string]::IsNullOrWhiteSpace($inputUser)) {
            # Nếu bỏ trống thì tạo ngẫu nhiên
            $randUser = "user" + (Get-Random -Minimum 1000 -Maximum 9999)
        } else {
            # Nếu có nhập thì lấy tên đã nhập
            $randUser = $inputUser
        }

        # --- XỬ LÝ MẬT KHẨU ---
        $inputPass = "${{ github.event.inputs.password }}"
        if ([string]::IsNullOrWhiteSpace($inputPass)) {
            # Nếu bỏ trống thì tạo ngẫu nhiên (Đảm bảo đủ độ mạnh cho Windows)
            $randPass = "P@" + (Get-Random -Minimum 10000 -Maximum 99999) + "abc!"
        } else {
            # Nếu có nhập thì lấy pass đã nhập
            $randPass = $inputPass
        }
        
        # Tạo user trên Windows
        net user $randUser $randPass /add
        net localgroup administrators $randUser /add
        net localgroup "Remote Desktop Users" $randUser /add
        
        # Lưu vào biến môi trường để bước sau in ra log
        echo "FINAL_USER=$randUser" >> $env:GITHUB_ENV
        echo "FINAL_PASS=$randPass" >> $env:GITHUB_ENV

    - name: 2. Cài đặt Tailscale
      shell: powershell
      env:
        TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
      run: |
        winget install --id Tailscale.Tailscale -e --silent --accept-package-agreements --accept-source-agreements
        Start-Sleep -Seconds 5
        
        $tsPath = "C:\Program Files\Tailscale\tailscale.exe"
        $hostname = "${{ github.event.inputs.hostname }}"
        
        & $tsPath up --authkey $env:TAILSCALE_AUTHKEY --hostname $hostname --unattended

    - name: 3. Lấy thông tin & Giữ máy chạy
      shell: powershell
      run: |
        $tsPath = "C:\Program Files\Tailscale\tailscale.exe"
        $ip = & $tsPath ip -4
        
        Write-Host "=============================================="
        Write-Host "MÁY ẢO ĐÃ SẴN SÀNG!"
        Write-Host "IP Address: $ip"
        Write-Host "Hostname  : ${{ github.event.inputs.hostname }}"
        Write-Host "Username  : $env:FINAL_USER"
        Write-Host "Password  : $env:FINAL_PASS"
        Write-Host "=============================================="
        Write-Host "Kết nối RDP nhớ nhập tài khoản dạng: .\$env:FINAL_USER"
        
        $duration = 350 * 60 
        $elapsed = 0
        while ($elapsed -lt $duration) {
            Write-Host "[$(Get-Date -Format 'HH:mm:ss')] Máy vẫn đang chạy..."
            Start-Sleep -Seconds 300
            $elapsed += 300
        }
