name: Windows RDP Persistent via Tailscale

on:
  workflow_dispatch: 
    inputs:
      hostname:
        description: 'Nhập tên máy ảo (vd: pc-cua-toi, win-test...)'
        required: true
        default: 'github-win'

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360 

    steps:
    - name: 1. Setup RDP, Tắt chế độ ngủ & Tạo User ngẫu nhiên
      shell: powershell
      run: |
        # Bật RDP
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        
        # Ép Windows không ngủ
        powercfg /change standby-timeout-ac 0
        powercfg /change monitor-timeout-ac 0
        powercfg /change hibernate-timeout-ac 0
        
        # TẠO USER VÀ PASS NGẪU NHIÊN
        $randUser = "user" + (Get-Random -Minimum 1000 -Maximum 9999)
        $randPass = "P@" + (Get-Random -Minimum 10000 -Maximum 99999) + "abc!"
        
        # Tạo user trên Windows
        net user $randUser $randPass /add
        # Phân quyền Admin và cho phép RDP
        net localgroup administrators $randUser /add
        net localgroup "Remote Desktop Users" $randUser /add
        
        # Lưu thông tin vào biến môi trường để xài cho bước sau
        echo "RAND_USER=$randUser" >> $env:GITHUB_ENV
        echo "RAND_PASS=$randPass" >> $env:GITHUB_ENV

    - name: 2. Cài đặt & Kết nối Tailscale
      shell: powershell
      env:
        TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
      run: |
        $url = "https://pkgs.tailscale.com/stable/tailscale-setup-latest.exe"
        Invoke-WebRequest -Uri $url -OutFile "$env:TEMP\tailscale-setup.exe"
        Start-Process -FilePath "$env:TEMP\tailscale-setup.exe" -ArgumentList "/quiet" -Wait
        
        # Sử dụng tên máy do người dùng nhập từ bảng
        $hostname = "${{ github.event.inputs.hostname }}"
        & "C:\Program Files\Tailscale\tailscale.exe" up --authkey $env:TAILSCALE_AUTHKEY --hostname $hostname --unattended

    - name: 3. Hiển thị thông tin & Giữ phiên chạy
      shell: powershell
      run: |
        $ip = & "C:\Program Files\Tailscale\tailscale.exe" ip -4
        
        Write-Host "=============================================="
        Write-Host "MÁY ẢO ĐÃ SẴN SÀNG!"
        Write-Host "IP Address (Tailscale): $ip"
        Write-Host "Hostname (Tên máy)    : ${{ github.event.inputs.hostname }}"
        Write-Host "Username (Tài khoản)  : $env:RAND_USER"
        Write-Host "Password (Mật khẩu)   : $env:RAND_PASS"
        Write-Host "=============================================="
        Write-Host "LƯU Ý: Khi kết nối RDP, nếu nó hỏi tài khoản, hãy nhập dạng: .\$env:RAND_USER"
        
        # Vòng lặp Watchdog giữ máy chạy 350 phút
        $duration = 350 * 60 
        $elapsed = 0
        
        while ($elapsed -lt $duration) {
            Write-Host "[$(Get-Date -Format 'HH:mm:ss')] Đang duy trì kết nối..."
            
            $ping = Test-Connection 8.8.8.8 -Count 1 -Quiet
            if (-not $ping) { Write-Host "Cảnh báo: Mất kết nối mạng!" }

            # Check Tailscale
            $tsStatus = & "C:\Program Files\Tailscale\tailscale.exe" status
            if ($LASTEXITCODE -ne 0) {
                & "C:\Program Files\Tailscale\tailscale.exe" up --authkey $env:TAILSCALE_AUTHKEY --hostname "${{ github.event.inputs.hostname }}" --unattended
            }

            # Check RDP
            $rdpService = Get-Service -Name TermService
            if ($rdpService.Status -ne 'Running') { Start-Service -Name TermService }

            Start-Sleep -Seconds 300
            $elapsed += 300
        }
