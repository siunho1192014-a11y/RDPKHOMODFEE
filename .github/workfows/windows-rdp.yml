name: Windows RDP via Tailscale

on:
  workflow_dispatch: 

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360 

    steps:
    - name: 1. Enable RDP
      shell: powershell
      run: |
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        net user runneradmin "WindowsRDP#2025"

    - name: 2. Install & Connect Tailscale
      shell: powershell
      env:
        TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
      run: |
        $url = "https://pkgs.tailscale.com/stable/tailscale-setup-latest.exe"
        Invoke-WebRequest -Uri $url -OutFile "$env:TEMP\tailscale-setup.exe"
        Start-Process -FilePath "$env:TEMP\tailscale-setup.exe" -ArgumentList "/quiet" -Wait
        & "C:\Program Files\Tailscale\tailscale.exe" up --authkey $env:TAILSCALE_AUTHKEY --hostname "github-actions-win"

    - name: 3. Display Connection Info & Keep Alive
      shell: powershell
      run: |
        $ip = & "C:\Program Files\Tailscale\tailscale.exe" ip -4
        Write-Host "================ RDP IS READY ================"
        Write-Host "IP Address: $ip"
        Write-Host "Username  : runneradmin"
        Write-Host "Password  : WindowsRDP#2025"
        Write-Host "=============================================="
        while ($true) { Start-Sleep -Seconds 3600 }
